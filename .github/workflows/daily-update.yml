name: Daily README Contribution

on:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update README
        run: |
          TODAY=$(TZ=Asia/Kolkata date +"%Y-%m-%d")
          sed -i "s/<!-- DAILY_UPDATE: .* -->/<!-- DAILY_UPDATE: $TODAY -->/" README.md

      - name: Commit README change
        run: |
          git config user.name "TheSiddKid"
          git config user.email "204383960+TheSiddKid@users.noreply.github.com"
          git add README.md
          git commit -m "chore: daily README update" || exit 0
          git push
